    { name = "Allam235", email = "106848509+Allam235@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "faiss-cpu>=1.15.0",
    "langchain>=1.3.18",
    "langchain-community>=0.4.2",
    "langchain-core>=1.6.1",
    "langchain-text-splitters>=0.3.0",
    "pymupdf>=1.28.2",
    "pypdf>=6.16.2",
    "scikit-learn>=1.5.0",
    "sentence-transformers>=6.0.0",
